services:
  postgres:
    image: postgres:17
    container_name: forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_dev_password
    ports:
      - "5432:5432"
    volumes:
      - forge-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: forge-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - forge-redis-data:/data

  kafka:
    image: apache/kafka:3.9.0
    container_name: forge-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - forge-kafka-data:/var/lib/kafka/data

  sonarqube:
    image: sonarqube:community
    container_name: forge-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - forge-sonarqube-data:/opt/sonarqube/data
      - forge-sonarqube-logs:/opt/sonarqube/logs
      - forge-sonarqube-extensions:/opt/sonarqube/extensions

volumes:
  forge-postgres-data:
  forge-redis-data:
  forge-kafka-data:
  forge-sonarqube-data:
  forge-sonarqube-logs:
  forge-sonarqube-extensions:

spring.application.name=forge-notification-service
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://notification-postgres:5432/notifications}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:notifications}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:notifications_dev_password}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:forge-notification-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.flyway.enabled=false
spring.sql.init.mode=always
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:0.1}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318/v1/traces}
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
logging.structured.format.console=ecs

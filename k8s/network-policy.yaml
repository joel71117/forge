apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forge-api-default-deny
  namespace: forge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: forge-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9092
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forge-api
  namespace: forge
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  ingressClassName: nginx
  rules:
    - host: forge.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forge-api
                port:
                  name: http
apiVersion: v1
kind: Service
metadata:
  name: notification-postgres
  namespace: forge
spec:
  selector: { app.kubernetes.io/name: notification-postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notification-postgres
  namespace: forge
  labels: { app.kubernetes.io/name: notification-postgres }
spec:
  serviceName: notification-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: notification-postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: notification-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              value: notifications
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: forge-notification-secrets, key: SPRING_DATASOURCE_USERNAME } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: forge-notification-secrets, key: SPRING_DATASOURCE_PASSWORD } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }

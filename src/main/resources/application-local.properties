# Activate this configuration only with the local Spring profile.
spring.config.activate.on-profile=local
# Allow test or local infrastructure beans to replace default beans when needed.
spring.main.allow-bean-definition-overriding=true

# Local PostgreSQL connection.
spring.datasource.url=jdbc:postgresql://localhost:5432/forge
spring.datasource.username=forge
spring.datasource.password=forge_dev_password

# Local Redis connection.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka broker connection and application-level Kafka switches.
spring.kafka.bootstrap-servers=localhost:9092
forge.kafka.enabled=false
forge.kafka.events-topic=forge.learning.events
forge.kafka.consumer.enabled=true
forge.kafka.consumer.group-id=forge-job-workers

# Kafka consumer serialization and offset behavior.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Keep the application running when the configured topic does not yet exist.
spring.kafka.listener.missing-topics-fatal=false

# Kafka producer serialization.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Transactional outbox settings. Events are persisted first and dispatched to Kafka later.
forge.outbox.enabled=true
forge.outbox.batch-size=50
forge.outbox.poll-interval-ms=1000

# Interval for collecting application observability data.
forge.observability.poll-interval-ms=5000

# Optional distributed lock settings.
forge.redis.locks.enabled=false

# Optional scheduled task ownership settings for distributed deployments.
forge.scheduled-ownership.enabled=false
forge.scheduled-ownership.interval-ms=10000
forge.scheduled-ownership.lease=30s

# Optional Redis-backed rate limiting settings.
forge.redis.rate-limit.enabled=false
forge.redis.rate-limit.limit=120
forge.redis.rate-limit.window-seconds=60

# Optional Redis cache settings.
forge.redis.cache.enabled=false
forge.redis.cache.ttl-seconds=300

# JPA, Hibernate, and database migration settings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true

# SQL and parameter logging for local development.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# HikariCP database connection pool settings.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
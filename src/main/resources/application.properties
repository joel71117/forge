spring.application.name=forge


logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

forge.order.idempotency.enabled=true
forge.inventory.reservation-duration=1h
forge.job.default-max-retries=3
forge.job.executor.core-pool-size=4
forge.job.executor.max-pool-size=8
forge.job.executor.queue-capacity=1000
forge.job.executor.keep-alive-time=60s
forge.job.executor.shutdown-timeout=30s
forge.job.executor.base-retry-delay=100ms
forge.job.executor.max-retry-delay=30s
forge.kafka.retry.attempts=4
forge.kafka.retry.delay-ms=1000
forge.kafka.retry.multiplier=2.0
forge.kafka.retry.max-delay-ms=8000
forge.kafka.retry.jitter-ms=250
forge.notification.default-priority=NORMAL